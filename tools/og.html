<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>OG-картинка 1200×630</title>
  <!-- Служебный файл: из него рендерится assets/og.png. На сайт не выкладывается. -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; }
    body {
      background: #ffffff;
      color: #0d1b2a;
      font-family: "Bahnschrift", "Segoe UI", Arial, sans-serif;
      padding: 64px 80px 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      width: 1000px; height: 700px;
      right: -380px; top: -260px;
      background: radial-gradient(circle, #e8eef8 0%, transparent 65%);
    }
    .logo { height: 84px; width: auto; align-self: flex-start; position: relative; }
    .rule { width: 64px; height: 6px; background: #e8552f; margin: 40px 0 24px; position: relative; }
    h1 {
      font-size: 58px;
      line-height: 1.08;
      font-weight: 600;
      letter-spacing: -1px;
      margin: 0;
      max-width: 960px;
      position: relative;
    }
    h1 em { font-style: normal; color: #3060a0; }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px solid #dde3ea;
      padding: 26px 0 34px;
      font-size: 25px;
      position: relative;
    }
    .bottom .muted { color: #526272; }
    .bottom .phone { font-size: 32px; font-weight: 600; color: #3060a0; }
    .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; display: flex; }
    .stripe i { flex: 1; }
    .stripe .s1 { background: #ffffff; border-top: 1px solid #dde3ea; }
    .stripe .s2 { background: #3060a0; }
    .stripe .s3 { background: #e8552f; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <img class="logo" src="../assets/logo.png" alt="">

  <div>
    <div class="rule"></div>
    <h1>Комплектующие и компьютеры<br><em>для вашего бизнеса</em></h1>
  </div>

  <div class="bottom">
    <div class="muted">Иваново, ул. Степанова, 24 · с 1999 года</div>
    <div class="phone">+7 4932 353070</div>
  </div>

  <div class="stripe"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
</body>
</html>
